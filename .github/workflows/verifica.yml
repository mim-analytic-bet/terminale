name: Verifica locale senza rete dati
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B scripts/aggiorna_dashboard.py --anteprima
      - run: node tests/test_interfaccia.js
      - run: python3 -B scripts/verifica_snapshot.py
