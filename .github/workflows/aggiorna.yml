name: Aggiorna dashboard
on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aggiorna
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install numpy pillow
      - name: Scarica dati e rigenera
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY || secrets.APIS_NINJAS_KEY }}
        run: bash scripts/aggiorna_tutto.sh
      - name: Controllo download
        run: |
          if tail -40 dati/aggiornamento.log | grep -q "FALLITO"; then echo "::warning::Alcuni download non sono riusciti (vedi dati/aggiornamento.log)"; fi
      - name: Controllo registro proposte
        run: |
          node --version
          if ! grep -q "Proposte:" dati/aggiornamento.log && ! tail -60 dati/aggiornamento.log | grep -q "Registro proposte"; then echo "::warning::Nessuna riga sul registro delle proposte nel log"; fi
          if tail -60 dati/aggiornamento.log | grep -q "Registro proposte non aggiornato"; then echo "::warning::Registro proposte non aggiornato (vedi dati/aggiornamento.log)"; fi
      - name: Pubblica
        run: |
          cp scheda-partita-dashboard.html index.html
          git config user.name "aggiornamento-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Aggiornamento automatico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
